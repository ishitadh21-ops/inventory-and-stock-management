<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockPilot — Inventory Management</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#182230;--muted:#718096;--line:#e7ebf2;--nav:#111827;--accent:#635bff;--accent2:#e9e8ff;--green:#168a62;--greenbg:#e2f7ed;--amber:#b7791f;--amberbg:#fff4d6;--red:#c2414b;--redbg:#ffe7e9;--shadow:0 8px 28px rgba(25,35,60,.055)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:var(--nav);color:#d5dbea;padding:25px 16px;display:flex;flex-direction:column;gap:28px}.brand{display:flex;gap:11px;align-items:center;padding:0 10px;color:white;font-size:19px;font-weight:800;letter-spacing:-.5px}.brandmark{width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,#8b83ff,#5b4bdf);display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px}.brand small{display:block;color:#98a3b8;font-size:10px;letter-spacing:1.8px;font-weight:700;margin-top:2px}.navlabel{font-size:10px;font-weight:800;color:#78859b;letter-spacing:1.4px;padding:0 12px;margin-bottom:8px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:10px;background:transparent;color:#aeb8cb;text-align:left;font-size:13px;font-weight:650}.nav button .ico{font-size:17px;width:20px;text-align:center}.nav button.active,.nav button:hover{background:#272e43;color:white}.nav button.active{box-shadow:inset 3px 0 #8b83ff}.sidebottom{margin-top:auto;padding:16px 12px;border:1px solid #30384b;border-radius:12px;font-size:12px;color:#aeb8cb;line-height:1.6}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#43d69a;margin-right:6px}.main{min-width:0}.topbar{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:20px}.crumb{font-size:12px;color:var(--muted)}.crumb strong{color:var(--ink);font-size:13px}.topright{display:flex;align-items:center;gap:14px}.localtag{background:#f1f0ff;color:#5d54d9;padding:8px 11px;border-radius:9px;font-size:11px;font-weight:750}.avatar{width:36px;height:36px;border-radius:50%;background:#e7e5ff;color:#5147c9;display:grid;place-items:center;font-weight:800;font-size:12px}.content{padding:30px 34px 44px;max-width:1600px;margin:auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:25px}.eyebrow{font-size:11px;letter-spacing:1.4px;color:var(--accent);font-weight:800;text-transform:uppercase;margin-bottom:8px}.pagehead h1{font-size:28px;letter-spacing:-1px;margin:0 0 7px}.pagehead p{margin:0;color:var(--muted);font-size:13px}.btn{border-radius:9px;padding:11px 15px;font-weight:750;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s}.primary{background:var(--accent);color:white;box-shadow:0 4px 10px #635bff30}.primary:hover{background:#5148ec}.secondary{background:#fff;border:1px solid var(--line);color:#394357}.danger{background:var(--redbg);color:var(--red)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:19px;box-shadow:var(--shadow)}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:650}.stat-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:#eeedff;color:var(--accent)}.stat:nth-child(2) .stat-icon{background:#e0f7ee;color:var(--green)}.stat:nth-child(3) .stat-icon{background:#fff1d8;color:var(--amber)}.stat:nth-child(4) .stat-icon{background:#e7f0ff;color:#3674d9}.stat-num{font-size:27px;font-weight:800;letter-spacing:-.8px;margin:15px 0 5px}.stat-foot{font-size:11px;color:var(--muted)}.stat-foot b{color:var(--green)}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.panelhead{display:flex;justify-content:space-between;align-items:center;padding:19px 21px;border-bottom:1px solid var(--line);gap:12px}.panelhead h2{font-size:15px;margin:0 0 4px;letter-spacing:-.2px}.panelhead p{margin:0;color:var(--muted);font-size:11px}.toolbar{padding:15px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}.searchbox{position:relative;flex:1;min-width:180px}.searchbox span{position:absolute;left:12px;top:10px;color:#99a2b3}.searchbox input{padding-left:35px;width:100%}input,select,textarea{border:1px solid #dfe4ed;border-radius:8px;padding:10px 11px;color:var(--ink);background:white;outline:none;font-size:12px;width:100%}input:focus,select:focus,textarea:focus{border-color:#928bff;box-shadow:0 0 0 3px #635bff17}.toolbar select{width:auto;min-width:135px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{background:#fbfcfe;text-align:left;padding:12px 20px;font-size:10px;color:#7a8497;text-transform:uppercase;letter-spacing:.7px;font-weight:800;border-bottom:1px solid var(--line)}td{padding:14px 20px;border-bottom:1px solid #eff1f6;font-size:12px}tbody tr:hover{background:#fafbff}tbody tr:last-child td{border-bottom:0}.prod{display:flex;align-items:center;gap:11px}.prodicon{width:36px;height:36px;border-radius:10px;background:#f0efff;display:grid;place-items:center;font-size:17px}.prodname{font-weight:750;font-size:12px}.prodsku{color:#9aa3b2;font-size:10px;margin-top:4px}.badge{display:inline-flex;padding:5px 8px;border-radius:6px;font-size:10px;font-weight:800}.bgreen{background:var(--greenbg);color:var(--green)}.bamber{background:var(--amberbg);color:var(--amber)}.bred{background:var(--redbg);color:var(--red)}.actionrow{display:flex;gap:6px}.iconbtn{background:#f3f5fa;border:1px solid #e7ebf2;border-radius:7px;width:29px;height:29px;color:#626d80}.iconbtn:hover{background:#e9e8ff;color:var(--accent)}.lowergrid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:20px}.listrow{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #eff1f6}.listrow:last-child{border-bottom:0}.listrow .details{flex:1;min-width:0}.listrow .details strong{font-size:12px;display:block}.listrow .details span{font-size:10px;color:var(--muted);display:block;margin-top:4px}.listrow .qty{font-size:12px;font-weight:800}.bararea{padding:20px}.barrow{display:grid;grid-template-columns:95px 1fr 35px;gap:10px;align-items:center;margin:15px 0;font-size:11px}.bartrack{height:8px;background:#f0f1f7;border-radius:99px;overflow:hidden}.barfill{height:100%;background:linear-gradient(90deg,#8178ff,#5b50e5);border-radius:99px}.empty{padding:36px;text-align:center;color:var(--muted);font-size:12px}.hidden{display:none!important}.notice{padding:12px 14px;border-radius:9px;background:#f2f0ff;color:#5a50c9;font-size:11px;line-height:1.5;margin-bottom:18px}.sectiontitle{font-size:16px;margin:24px 0 13px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:11px;font-weight:750;margin-bottom:7px;color:#4a5568}.field.full{grid-column:1/-1}.modalback{position:fixed;inset:0;background:#11182785;display:grid;place-items:center;padding:20px;z-index:10}.modal{background:white;border-radius:16px;width:min(540px,100%);max-height:90vh;overflow:auto;box-shadow:0 25px 80px #11182740}.modalhead{padding:21px 23px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;font-size:17px}.modalbody{padding:22px 23px}.modalfoot{padding:16px 23px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.close{background:transparent;font-size:23px;color:#8791a3}.toast{position:fixed;right:24px;bottom:24px;background:#172033;color:white;padding:13px 17px;border-radius:10px;box-shadow:var(--shadow);font-size:12px;z-index:30;animation:pop .2s ease}.toast.error{background:#a82f3c}@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}.footnote{font-size:10px;color:#9aa3b2;text-align:center;padding:20px}.mobiletop{display:none}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:25px 22px}.topbar{padding:0 22px}.app{grid-template-columns:215px 1fr}.lowergrid{grid-template-columns:1fr}}
@media(max-width:720px){.app{display:block}.sidebar{display:none}.mobiletop{display:flex;background:var(--nav);padding:14px 18px;justify-content:space-between;align-items:center;color:white}.mobiletop select{width:auto;max-width:170px;background:#272e43;color:white;border-color:#3b4358}.topbar{height:58px;padding:0 16px}.content{padding:22px 14px}.pagehead{align-items:flex-start}.pagehead h1{font-size:23px}.pagehead>.btn{padding:10px;font-size:11px}.stats{gap:10px}.stat{padding:14px}.stat-num{font-size:23px}.stat-top{font-size:10px}.localtag{display:none}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.panelhead{padding:16px}.toolbar{padding:12px}.lowergrid{gap:12px}.barrow{grid-template-columns:80px 1fr 25px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brandmark">S</div><div>StockPilot<small>INVENTORY SUITE</small></div></div>
  <div><div class="navlabel">WORKSPACE</div><nav class="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
    <button data-page="products"><span class="ico">▤</span>Products</button>
    <button data-page="stock"><span class="ico">⇄</span>Stock movements</button>
    <button data-page="categories"><span class="ico">▧</span>Categories</button>
    <button data-page="suppliers"><span class="ico">♧</span>Suppliers</button>
    <button data-page="reports"><span class="ico">▥</span>Reports & analytics</button>
  </nav></div>
  <div class="sidebottom"><span class="dot"></span>Demo environment is running<br><span style="color:#78859b">Changes save in this browser only.</span></div>
</aside>
<main class="main">
  <div class="mobiletop"><div class="brand" style="padding:0"><div class="brandmark">S</div><div>StockPilot</div></div><select id="mobileNav" aria-label="Navigate"><option value="dashboard">Dashboard</option><option value="products">Products</option><option value="stock">Stock movements</option><option value="categories">Categories</option><option value="suppliers">Suppliers</option><option value="reports">Reports & analytics</option></select></div>
  <header class="topbar"><div class="crumb">Workspace&nbsp; / &nbsp;<strong id="crumb">Dashboard</strong></div><div class="topright"><span class="localtag">● INTERACTIVE DEMO</span><div class="avatar">AD</div></div></header>
  <div class="content" id="content"></div>
  <div class="footnote">StockPilot Inventory Suite · Browser-only demo · Sample data</div>
</main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const seed = {
 categories:[{id:1,name:"Electronics",description:"Electronic devices and accessories"},{id:2,name:"Stationery",description:"Office and educational supplies"},{id:3,name:"Furniture",description:"Office and household furniture"},{id:4,name:"Accessories",description:"General accessories"}],
 suppliers:[{id:1,name:"Tech World",contact:"Rahul Shah",phone:"9876543210",email:"tech@example.com",address:"Vadodara"},{id:2,name:"Office Supplies Co.",contact:"Neha Patel",phone:"9876501234",email:"office@example.com",address:"Anand"},{id:3,name:"Furniture Hub",contact:"Amit Mehta",phone:"9876512345",email:"furniture@example.com",address:"Ahmedabad"}],
 products:[{id:1,name:"Wireless Mouse",sku:"PRD-0001",categoryId:1,supplierId:1,price:599,stock:52,reorder:10,icon:"🖱️"},{id:2,name:"Keyboard",sku:"PRD-0002",categoryId:1,supplierId:1,price:899,stock:30,reorder:8,icon:"⌨️"},{id:3,name:"Notebook",sku:"PRD-0003",categoryId:2,supplierId:2,price:60,stock:15,reorder:20,icon:"📒"},{id:4,name:"Office Chair",sku:"PRD-0004",categoryId:3,supplierId:3,price:4500,stock:10,reorder:3,icon:"🪑"},{id:5,name:"USB Cable",sku:"PRD-0005",categoryId:4,supplierId:1,price:199,stock:40,reorder:15,icon:"🔌"}],
 transactions:[{id:1,productId:1,type:"IN",qty:50,date:Date.now()-86400000*5,note:"Initial stock received"},{id:2,productId:2,type:"IN",qty:30,date:Date.now()-86400000*4,note:"Initial stock received"},{id:3,productId:3,type:"IN",qty:100,date:Date.now()-86400000*3,note:"Initial stock received"},{id:4,productId:4,type:"IN",qty:10,date:Date.now()-86400000*2,note:"Initial stock received"},{id:5,productId:5,type:"IN",qty:40,date:Date.now()-86400000,note:"Initial stock received"},{id:6,productId:1,type:"OUT",qty:5,date:Date.now()-3600000*20,note:"Items sold"},{id:7,productId:3,type:"OUT",qty:85,date:Date.now()-3600000*10,note:"Items issued"},{id:8,productId:1,type:"IN",qty:10,date:Date.now()-3600000*4,note:"Restock test"},{id:9,productId:1,type:"OUT",qty:3,date:Date.now()-3600000*2,note:"Stock issue test"}]
};
let db;
try{db=JSON.parse(localStorage.getItem("stockpilot-demo-db"))||structuredClone(seed)}catch(e){db=JSON.parse(JSON.stringify(seed))}
let page="dashboard", productFilter="", statusFilter="all", editingId=null;
const $=s=>document.querySelector(s);
const money=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:2}).format(n||0);
const fmtDate=n=>new Date(n).toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const catName=id=>db.categories.find(x=>x.id===Number(id))?.name||"Uncategorised";
const supplierName=id=>db.suppliers.find(x=>x.id===Number(id))?.name||"—";
const status=p=>p.stock===0?"Out of stock":p.stock<=p.reorder?"Low stock":"In stock";
const statusBadge=p=>`<span class="badge ${p.stock===0?'bred':p.stock<=p.reorder?'bamber':'bgreen'}">${status(p)}</span>`;
const iconFor=c=>({"Electronics":"⚡","Stationery":"📒","Furniture":"🪑","Accessories":"🔌"}[c]||"📦");
function save(){localStorage.setItem("stockpilot-demo-db",JSON.stringify(db))}
function toast(msg,error=false){let root=$("#toastRoot");root.innerHTML=`<div class="toast ${error?'error':''}">${msg}</div>`;setTimeout(()=>root.innerHTML="",2800)}
function go(p){page=p;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));$("#mobileNav").value=p;$("#crumb").textContent=({dashboard:"Dashboard",products:"Products",stock:"Stock movements",categories:"Categories",suppliers:"Suppliers",reports:"Reports & analytics"})[p];render()}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
$("#mobileNav").addEventListener("change",e=>go(e.target.value));
function pageHead(title,sub,action="",label=""){return `<div class="pagehead"><div><div class="eyebrow">INVENTORY OVERVIEW</div><h1>${title}</h1><p>${sub}</p></div>${action?`<button class="btn primary" onclick="${action}">${label}</button>`:""}</div>`}
function stat(title,value,foot,ico){return `<div class="stat"><div class="stat-top"><span>${title}</span><span class="stat-icon">${ico}</span></div><div class="stat-num">${value}</div><div class="stat-foot">${foot}</div></div>`}
function productRows(products){if(!products.length)return `<tr><td colspan="7"><div class="empty">No products match your filters.</div></td></tr>`;return products.map(p=>`<tr><td><div class="prod"><div class="prodicon">${p.icon||iconFor(catName(p.categoryId))}</div><div><div class="prodname">${esc(p.name)}</div><div class="prodsku">${esc(p.sku)}</div></div></div></td><td>${esc(catName(p.categoryId))}</td><td>${money(p.price)}</td><td><strong>${p.stock}</strong> units</td><td>${p.reorder}</td><td>${statusBadge(p)}</td><td><div class="actionrow"><button class="iconbtn" title="Edit product" onclick="openProduct(${p.id})">✎</button><button class="iconbtn" title="Stock in/out" onclick="openMovement(${p.id})">⇄</button><button class="iconbtn" title="Delete product" onclick="deleteProduct(${p.id})">×</button></div></td></tr>`).join("")}
function table(products){return `<div class="tablewrap"><table><thead><tr><th>Product</th><th>Category</th><th>Unit price</th><th>Available</th><th>Reorder at</th><th>Status</th><th>Actions</th></tr></thead><tbody>${productRows(products)}</tbody></table></div>`}
function recentRows(items){if(!items.length)return `<div class="empty">No stock movements yet.</div>`;return items.slice().sort((a,b)=>b.date-a.date).slice(0,5).map(t=>{let p=db.products.find(p=>p.id===t.productId);return `<div class="listrow"><div class="prodicon" style="background:${t.type==='IN'?'#e2f7ed':'#fff1d8'}">${t.type==='IN'?'↙':'↗'}</div><div class="details"><strong>${esc(p?.name||'Deleted product')}</strong><span>${esc(t.note||'Stock movement')} · ${fmtDate(t.date)}</span></div><div class="qty" style="color:${t.type==='IN'?'var(--green)':'var(--amber)'}">${t.type==='IN'?'+':'−'}${t.qty}</div></div>`}).join("")}
function renderDashboard(){let total=db.products.length,units=db.products.reduce((a,p)=>a+p.stock,0),value=db.products.reduce((a,p)=>a+p.stock*p.price,0),low=db.products.filter(p=>p.stock<=p.reorder).length;let cats=db.categories.map(c=>({name:c.name,count:db.products.filter(p=>p.categoryId===c.id).length}));let max=Math.max(1,...cats.map(c=>c.count));return `${pageHead("Good morning, Admin 👋","Here’s what’s happening with your inventory today.", "openProduct()","+ Add product")}<div class="stats">${stat("Total products",total,"Unique products tracked","▤")}${stat("Units in stock",units,"Across all products","▦")}${stat("Low / out of stock",low,low?"Needs your attention":"Stock levels look healthy","⚠")}${stat("Inventory value",money(value),"Based on current unit prices","₹")}</div><div class="panel"><div class="panelhead"><div><h2>Product inventory</h2><p>Monitor stock levels and take quick actions</p></div><button class="btn secondary" onclick="go('products')">View all products →</button></div>${table(db.products.slice(0,5))}</div><div class="lowergrid"><div class="panel"><div class="panelhead"><div><h2>Recent stock movements</h2><p>Latest changes to your inventory</p></div><button class="btn secondary" onclick="go('stock')">View history</button></div>${recentRows(db.transactions)}</div><div class="panel"><div class="panelhead"><div><h2>Products by category</h2><p>Distribution across your catalog</p></div></div><div class="bararea">${cats.map(c=>`<div class="barrow"><span>${esc(c.name)}</span><div class="bartrack"><div class="barfill" style="width:${c.count/max*100}%"></div></div><strong>${c.count}</strong></div>`).join("")}</div></div></div>`}
function renderProducts(){let products=db.products.filter(p=>(p.name+" "+p.sku+" "+catName(p.categoryId)).toLowerCase().includes(productFilter.toLowerCase())).filter(p=>statusFilter==="all"||(statusFilter==="low"&&p.stock>0&&p.stock<=p.reorder)||(statusFilter==="out"&&p.stock===0)||(statusFilter==="healthy"&&p.stock>p.reorder));return `${pageHead("Products","Manage your product catalog, prices and stock levels.","openProduct()","+ Add product")}<div class="notice">Demo data is stored in this browser. Product changes here do not update your MySQL database.</div><div class="panel"><div class="panelhead"><div><h2>All products <span style="color:#9aa3b2;font-weight:500">(${products.length})</span></h2><p>Search, edit or record a stock movement</p></div><button class="btn primary" onclick="openProduct()">＋ New product</button></div><div class="toolbar"><div class="searchbox"><span>⌕</span><input id="productSearch" placeholder="Search product or SKU..." value="${esc(productFilter)}" oninput="productFilter=this.value;refreshProductTable()"></div><select id="statusFilter" onchange="statusFilter=this.value;refreshProductTable()"><option value="all" ${statusFilter==='all'?'selected':''}>All statuses</option><option value="healthy" ${statusFilter==='healthy'?'selected':''}>In stock</option><option value="low" ${statusFilter==='low'?'selected':''}>Low stock</option><option value="out" ${statusFilter==='out'?'selected':''}>Out of stock</option></select></div><div id="productTable">${table(products)}</div></div>`}
function refreshProductTable(){let el=$("#productTable");if(el){let ps=db.products.filter(p=>(p.name+" "+p.sku+" "+catName(p.categoryId)).toLowerCase().includes(productFilter.toLowerCase())).filter(p=>statusFilter==="all"||(statusFilter==="low"&&p.stock>0&&p.stock<=p.reorder)||(statusFilter==="out"&&p.stock===0)||(statusFilter==="healthy"&&p.stock>p.reorder));el.innerHTML=table(ps);let h=$(".panelhead h2");if(h)h.innerHTML=`All products <span style="color:#9aa3b2;font-weight:500">(${ps.length})</span>`}}
function renderStock(){return `${pageHead("Stock movements","Record incoming stock and outgoing stock, and review movement history.","openMovement()","+ Record movement")}<div class="stats">${stat("Total movements",db.transactions.length,"Recorded stock events","⇄")}${stat("Stock received",db.transactions.filter(t=>t.type==='IN').reduce((a,t)=>a+t.qty,0),"Total units received","↙")}${stat("Stock issued",db.transactions.filter(t=>t.type==='OUT').reduce((a,t)=>a+t.qty,0),"Total units issued","↗")}${stat("Products needing stock",db.products.filter(p=>p.stock<=p.reorder).length,"At or below reorder level","⚠")}</div><div class="panel"><div class="panelhead"><div><h2>Movement history</h2><p>Each entry records a stock-in or stock-out action</p></div></div><div class="tablewrap"><table><thead><tr><th>Movement ID</th><th>Product</th><th>Type</th><th>Quantity</th><th>Date</th><th>Remarks</th></tr></thead><tbody>${db.transactions.slice().sort((a,b)=>b.date-a.date).map(t=>`<tr><td>#MOV-${String(t.id).padStart(4,'0')}</td><td><strong>${esc(db.products.find(p=>p.id===t.productId)?.name||'Deleted product')}</strong></td><td><span class="badge ${t.type==='IN'?'bgreen':'bamber'}">${t.type==='IN'?'Stock in':'Stock out'}</span></td><td style="font-weight:800">${t.type==='IN'?'+':'−'}${t.qty}</td><td>${fmtDate(t.date)}</td><td>${esc(t.note||'—')}</td></tr>`).join("")||`<tr><td colspan="6"><div class="empty">No movements recorded.</div></td></tr>`}</tbody></table></div></div>`}
function renderCategories(){return `${pageHead("Categories","Organise products into clear groups.","openCategory()","+ Add category")}<div class="stats">${stat("Total categories",db.categories.length,"Product groupings","▧")}${stat("Assigned products",db.products.filter(p=>p.categoryId).length,"Products with a category","▤")}${stat("Unassigned products",db.products.filter(p=>!p.categoryId).length,"Need categorisation","⚑")}${stat("Largest category",db.categories.length?Math.max(...db.categories.map(c=>db.products.filter(p=>p.categoryId===c.id).length)):0,"Products in largest group","▦")}</div><div class="panel"><div class="panelhead"><div><h2>Category directory</h2><p>Product groups and their descriptions</p></div><button class="btn primary" onclick="openCategory()">＋ New category</button></div><div class="tablewrap"><table><thead><tr><th>Category</th><th>Description</th><th>Products</th><th>Actions</th></tr></thead><tbody>${db.categories.map(c=>`<tr><td><div class="prod"><div class="prodicon">${iconFor(c.name)}</div><strong>${esc(c.name)}</strong></div></td><td>${esc(c.description||'—')}</td><td>${db.products.filter(p=>p.categoryId===c.id).length}</td><td><button class="iconbtn" onclick="deleteCategory(${c.id})" title="Delete category">×</button></td></tr>`).join("")||`<tr><td colspan="4"><div class="empty">No categories yet.</div></td></tr>`}</tbody></table></div></div>`}
function renderSuppliers(){return `${pageHead("Suppliers","Keep supplier contact information in one place.","openSupplier()","+ Add supplier")}<div class="stats">${stat("Total suppliers",db.suppliers.length,"Supplier directory","♧")}${stat("Products supplied",db.products.filter(p=>p.supplierId).length,"Linked to a supplier","▤")}${stat("Supplier locations",new Set(db.suppliers.map(s=>s.address).filter(Boolean)).size,"Distinct locations","⌖")}${stat("Unlinked products",db.products.filter(p=>!p.supplierId).length,"No supplier assigned","⚑")}</div><div class="panel"><div class="panelhead"><div><h2>Supplier directory</h2><p>Contact details and linked inventory</p></div><button class="btn primary" onclick="openSupplier()">＋ New supplier</button></div><div class="tablewrap"><table><thead><tr><th>Supplier</th><th>Contact person</th><th>Phone</th><th>Email</th><th>Location</th><th>Products</th><th>Actions</th></tr></thead><tbody>${db.suppliers.map(s=>`<tr><td><div class="prod"><div class="prodicon">♧</div><strong>${esc(s.name)}</strong></div></td><td>${esc(s.contact||'—')}</td><td>${esc(s.phone||'—')}</td><td>${esc(s.email||'—')}</td><td>${esc(s.address||'—')}</td><td>${db.products.filter(p=>p.supplierId===s.id).length}</td><td><button class="iconbtn" onclick="deleteSupplier(${s.id})" title="Delete supplier">×</button></td></tr>`).join("")||`<tr><td colspan="7"><div class="empty">No suppliers yet.</div></td></tr>`}</tbody></table></div></div>`}
function renderReports(){let value=db.products.reduce((a,p)=>a+p.price*p.stock,0),low=db.products.filter(p=>p.stock<=p.reorder);return `${pageHead("Reports & analytics","A quick summary of stock health and inventory value.","exportCsv()","↓ Export CSV")}<div class="stats">${stat("Inventory valuation",money(value),"Current units × unit price","₹")}${stat("Units available",db.products.reduce((a,p)=>a+p.stock,0),"Across all product records","▦")}${stat("Low-stock items",low.length,"At or below reorder level","⚠")}${stat("Transaction count",db.transactions.length,"All recorded movements","⇄")}</div><div class="lowergrid"><div class="panel"><div class="panelhead"><div><h2>Low-stock report</h2><p>Products at or below their reorder level</p></div><span class="badge ${low.length?'bamber':'bgreen'}">${low.length} items</span></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>Available</th><th>Reorder level</th><th>Status</th></tr></thead><tbody>${low.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${p.stock}</td><td>${p.reorder}</td><td>${statusBadge(p)}</td></tr>`).join("")||`<tr><td colspan="4"><div class="empty">No low-stock products. Nice!</div></td></tr>`}</tbody></table></div></div><div class="panel"><div class="panelhead"><div><h2>Inventory by category</h2><p>Stock value distribution</p></div></div><div class="bararea">${db.categories.map(c=>{let v=db.products.filter(p=>p.categoryId===c.id).reduce((a,p)=>a+p.price*p.stock,0);return `<div class="barrow" style="grid-template-columns:95px 1fr"><span>${esc(c.name)}</span><div><div class="bartrack"><div class="barfill" style="width:${value?v/value*100:0}%"></div></div><div style="font-size:10px;color:#8a94a5;margin-top:5px">${money(v)}</div></div></div>`}).join("")}</div></div></div><div class="panel" style="margin-top:20px"><div class="panelhead"><div><h2>Transaction history</h2><p>Full movement log, exportable as CSV</p></div><button class="btn secondary" onclick="go('stock')">Open movements →</button></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>Type</th><th>Quantity</th><th>Date</th><th>Remarks</th></tr></thead><tbody>${db.transactions.slice().sort((a,b)=>b.date-a.date).slice(0,8).map(t=>`<tr><td>${esc(db.products.find(p=>p.id===t.productId)?.name||'Deleted product')}</td><td><span class="badge ${t.type==='IN'?'bgreen':'bamber'}">${t.type}</span></td><td>${t.qty}</td><td>${fmtDate(t.date)}</td><td>${esc(t.note||'—')}</td></tr>`).join("")}</tbody></table></div></div>`}
function render(){let c=$("#content");c.innerHTML=({dashboard:renderDashboard,products:renderProducts,stock:renderStock,categories:renderCategories,suppliers:renderSuppliers,reports:renderReports})[page]();if(page==="products")refreshProductTable()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function openModal(title,body,saveLabel,saveFn){$("#modalRoot").innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div><div class="modalbody">${body}</div><div class="modalfoot"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" id="modalSave">${saveLabel}</button></div></div></div>`;$("#modalSave").onclick=saveFn}
function closeModal(){$("#modalRoot").innerHTML=""}
function openProduct(id=null){editingId=id;let p=id?db.products.find(x=>x.id===id):null;openModal(p?"Edit product":"Add new product",`<div class="formgrid"><div class="field full"><label>Product name *</label><input id="fName" value="${esc(p?.name||'')}" placeholder="e.g. Wireless Mouse"></div><div class="field"><label>Category *</label><select id="fCategory">${db.categories.map(c=>`<option value="${c.id}" ${p?.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join("")}</select></div><div class="field"><label>Supplier</label><select id="fSupplier"><option value="">No supplier</option>${db.suppliers.map(s=>`<option value="${s.id}" ${p?.supplierId===s.id?'selected':''}>${esc(s.name)}</option>`).join("")}</select></div><div class="field"><label>Unit price (₹) *</label><input id="fPrice" type="number" min="0" step=".01" value="${p?.price??''}" placeholder="599.00"></div><div class="field"><label>Reorder level *</label><input id="fReorder" type="number" min="0" step="1" value="${p?.reorder??10}"></div>${p?`<div class="field full"><label>Current stock</label><input value="${p.stock} units (change stock from Stock movements)" disabled></div>`:`<div class="field full"><label>Opening stock</label><input id="fStock" type="number" min="0" step="1" value="0"></div>`}</div>`,p?"Save changes":"Create product",()=>{let name=$("#fName").value.trim(),categoryId=Number($("#fCategory").value),supplierId=$("#fSupplier").value?Number($("#fSupplier").value):null,price=Number($("#fPrice").value),reorder=Number($("#fReorder").value),stock=p?p.stock:Number($("#fStock").value);if(!name||!Number.isFinite(price)||price<0||!Number.isInteger(reorder)||reorder<0||!Number.isInteger(stock)||stock<0){toast("Check product name, price and stock values.",true);return}if(p){Object.assign(p,{name,categoryId,supplierId,price,reorder});toast("Product updated")}else{let newId=Math.max(0,...db.products.map(x=>x.id))+1;db.products.push({id:newId,name,sku:"PRD-"+String(newId).padStart(4,"0"),categoryId,supplierId,price,reorder,stock,icon:iconFor(catName(categoryId))});if(stock>0)db.transactions.push({id:Math.max(0,...db.transactions.map(t=>t.id))+1,productId:newId,type:"IN",qty:stock,date:Date.now(),note:"Opening stock"});toast("Product created successfully")}save();closeModal();render()})}
function deleteProduct(id){let p=db.products.find(p=>p.id===id);if(!p)return;if(!confirm(`Delete ${p.name}? Its transaction history will remain as historical records.`))return;db.products=db.products.filter(p=>p.id!==id);save();render();toast("Product deleted")}
function openMovement(productId=null){openModal("Record stock movement",`<div class="formgrid"><div class="field full"><label>Product *</label><select id="mProduct">${db.products.map(p=>`<option value="${p.id}" ${productId===p.id?'selected':''}>${esc(p.name)} · ${p.stock} available</option>`).join("")}</select></div><div class="field"><label>Movement type *</label><select id="mType"><option value="IN">Stock in — receive</option><option value="OUT">Stock out — issue</option></select></div><div class="field"><label>Quantity *</label><input id="mQty" type="number" min="1" step="1" placeholder="e.g. 10"></div><div class="field full"><label>Remarks</label><input id="mNote" placeholder="e.g. New shipment or items sold"></div></div><div class="notice" style="margin:16px 0 0">Stock out cannot exceed the currently available quantity.</div>`,"Record movement",()=>{let pid=Number($("#mProduct").value),type=$("#mType").value,qty=Number($("#mQty").value),note=$("#mNote").value.trim(),p=db.products.find(x=>x.id===pid);if(!p||!Number.isInteger(qty)||qty<=0){toast("Enter a valid positive whole-number quantity.",true);return}if(type==="OUT"&&qty>p.stock){toast(`Insufficient stock. Only ${p.stock} units available.`,true);return}p.stock+=type==="IN"?qty:-qty;db.transactions.push({id:Math.max(0,...db.transactions.map(t=>t.id))+1,productId:pid,type,qty,date:Date.now(),note:note|| (type==="IN"?"Stock received":"Stock issued")});save();closeModal();render();toast(`Stock ${type==="IN"?"received":"issued"} successfully`)})}
function openCategory(){openModal("Add category",`<div class="formgrid"><div class="field full"><label>Category name *</label><input id="cName" placeholder="e.g. Networking"></div><div class="field full"><label>Description</label><textarea id="cDesc" rows="3" placeholder="What products belong here?"></textarea></div></div>`,"Create category",()=>{let name=$("#cName").value.trim(),description=$("#cDesc").value.trim();if(!name){toast("Enter a category name.",true);return}if(db.categories.some(c=>c.name.toLowerCase()===name.toLowerCase())){toast("That category already exists.",true);return}db.categories.push({id:Math.max(0,...db.categories.map(c=>c.id))+1,name,description});save();closeModal();render();toast("Category created")})}
function deleteCategory(id){if(db.products.some(p=>p.categoryId===id)){toast("Move or reassign its products before deleting this category.",true);return}if(!confirm("Delete this category?"))return;db.categories=db.categories.filter(c=>c.id!==id);save();render();toast("Category deleted")}
function openSupplier(){openModal("Add supplier",`<div class="formgrid"><div class="field full"><label>Supplier name *</label><input id="sName" placeholder="Company name"></div><div class="field"><label>Contact person</label><input id="sContact" placeholder="Full name"></div><div class="field"><label>Phone</label><input id="sPhone" placeholder="Phone number"></div><div class="field"><label>Email</label><input id="sEmail" type="email" placeholder="name@example.com"></div><div class="field"><label>Location</label><input id="sAddress" placeholder="City / address"></div></div>`,"Create supplier",()=>{let name=$("#sName").value.trim();if(!name){toast("Enter a supplier name.",true);return}db.suppliers.push({id:Math.max(0,...db.suppliers.map(s=>s.id))+1,name,contact:$("#sContact").value.trim(),phone:$("#sPhone").value.trim(),email:$("#sEmail").value.trim(),address:$("#sAddress").value.trim()});save();closeModal();render();toast("Supplier created")})}
function deleteSupplier(id){if(db.products.some(p=>p.supplierId===id)){toast("Reassign this supplier's products before deleting it.",true);return}if(!confirm("Delete this supplier?"))return;db.suppliers=db.suppliers.filter(s=>s.id!==id);save();render();toast("Supplier deleted")}
function exportCsv(){let rows=[["Product","SKU","Category","Supplier","Unit Price","Current Stock","Reorder Level","Stock Status","Stock Value"],...db.products.map(p=>[p.name,p.sku,catName(p.categoryId),supplierName(p.supplierId),p.price,p.stock,p.reorder,status(p),p.price*p.stock])];let csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");let blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="stockpilot-inventory-report.csv";a.click();URL.revokeObjectURL(url);toast("CSV report exported")}
render();
</script>
</body>
</html>
